<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Block Breaker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <div class="game-status" aria-live="polite">
        <span>Level <strong id="level">1</strong></span>
        <span>Lives <strong id="lives">3</strong></span>

      <canvas id="game" width="600" height="450" aria-label="Block Breaker game"></canvas>
      <p>Move the paddle with the left and right arrow keys, or A and D.</p>
   </main>

   <script src="game.js"></script>
   <script src="bricks.js"></script>
   <script src="collisions.js"></script>
  </body>
</html>
