<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Block Breaker</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <div class="game-status" aria-live="polite">
        <span>Level <strong id="level">1</strong></span>
        <span>Lives <strong id="lives">3</strong></span>
        <span>Score <strong id="score">0</strong></span>
        <span>High score <strong id="high-score">0</strong></span>
        <span>Combo <strong id="combo">x0</strong></span>
        <span>Bricks <strong id="bricks-left">0</strong></span>
        <span>Invaders <strong id="invaders-left">0</strong></span>
      </div>
      <canvas id="game" width="900" height="650" aria-label="Brick breaker and space invaders game"></canvas>
      <p id="powerup-status" aria-live="polite">No active power-ups</p>
      <p>Move with the left and right arrow keys or A and D. Press Space to launch or release a magnet-caught ball, F to fire lasers, P to pause, or R to restart.</p>
   </main>

   <script src="game.js"></script>
   <script src="bricks.js"></script>
   <script src="collisions.js"></script>
   <script src="mechanics.js"></script>
  </body>
</html>
